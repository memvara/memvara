# Equivalent mutants: mutants that no test can catch, because the change they make does not
# change what the code does. `bench/mutation.py` leaves them out of a module's score.
#
# One table per mutant. `mutant` is the name mutmut gives it, as `bench/mutation.py report
# --survivors` prints it; `reason` says why the mutant cannot change behaviour, in a
# sentence a reviewer can check against the code. A survivor that a test could catch is a
# missing test, not an equivalent, and does not belong here.
#
# mutmut numbers a function's mutants in order, so editing the function renames them. A run
# reports an entry whose mutant it did not produce as stale; delete it, or find the
# mutant's new name. The design allows at most ten entries. Past that, the tool should be
# replaced with cosmic-ray rather than the list grown.
#
#     [[equivalent]]
#     mutant = "memvara.write.reconcile.x_example__mutmut_1"
#     reason = "..."
