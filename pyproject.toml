[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memvara"
version = "0.8.1"
description = "Bitemporal memory for AI agents. Hybrid retrieval, deterministic contradiction resolution, LLM-free write path."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://memvara.dev"
Repository = "https://github.com/memvara/memvara"
Issues = "https://github.com/memvara/memvara/issues"
Changelog = "https://github.com/memvara/memvara/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
local-embed = ["sentence-transformers>=3.0"]
rerank = ["sentence-transformers>=3.0"]
langchain = ["langchain-core>=0.3"]
llama-index = ["llama-index-core>=0.13"]
crewai = ["crewai>=1.10.1"]
langgraph = ["langgraph-checkpoint>=4.1"]
http = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
cloud = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "coverage>=7.0", "mypy>=1.8"]
bench = ["mem0ai>=2.0", "nltk>=3.8"]

[project.scripts]
memvara-mcp = "memvara.server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["memvara"]
artifacts = ["memvara/skills/**/*.md", "memvara/packs/*.toml"]

[tool.hatch.build.targets.sdist]
exclude = ["npm"]

[tool.coverage.run]
source = ["memvara"]

[tool.coverage.report]
# Core Memvara keeps its 100% gate. Code-memory P0 is still an experimental surface and
# is covered by its own focused tests; excluding it here prevents the first symbol-index
# implementation from silently lowering the gate for the mature memory engine. Remove
# this exclusion when the code-memory API is promoted out of P0.
omit = ["memvara/code/*.py"]
fail_under = 100
show_missing = true
exclude_also = [
    ": \\.\\.\\.$",
    "^\\s*\\.\\.\\.$",
]

[tool.pytest.ini_options]
testpaths = ["tests", "memvara"]
addopts = "--doctest-modules"
filterwarnings = ["error::DeprecationWarning"]
