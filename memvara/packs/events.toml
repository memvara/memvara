# Things that happened, at a time, sometimes with a quantity.
#
# The 23 builtins describe what a user *is like* — where they live, what they prefer, what
# they are working on. They cannot describe what a user *did*: there is no predicate here
# for a run, a purchase or a visit, so a store asked "how much did I spend on gifts last
# month" has nothing to add up. Measured on LongMemEval-S, where the categories memvara
# loses on are exactly the ones asking for totals, elapsed time and event order.
#
# Load with MEMVARA_PREDICATES=events, or beside another pack:
# MEMVARA_PREDICATES=engineering,events.
#
# ## What belongs here, and what does not
#
# **Event predicates only** — a thing that happened, which `valid_from` places in time and
# `amount`/`unit` can measure. `ran`, `bought`, `visited`, `attended`.
#
# **Not quantity predicates.** There is no `distance`, `duration`, `cost` or `weight` here
# and there should not be. A quantity is carried by the `amount` and `unit` fields on the
# claim, which are generic and available to any predicate; a `distance` predicate would be
# a second way to say the same thing, and the two would drift. Without this rule the file
# becomes forty unrelated measurements inside six months.
#
# ## Every predicate here is multi-valued, and that is load-bearing
#
# `Cardinality.ONE` means a new value *retires* the old one. That is right for `lives_in`
# and catastrophic for `visited`: "I visited London last year" and "I visited Paris this
# year" are both still true, and declaring either `one` would make the second silently
# retire the first. `write/reconcile.py:_victims` collects supersession candidates only
# for functional predicates, so `many` is what keeps two events from competing at all —
# no temporal rule can rescue a predicate declared wrongly here.
#
# `tests/test_packs.py` asserts this for every predicate below rather than trusting the
# comment, because the failure is silent and looks like ordinary forgetting.
#
# Volatility is `fast` throughout: an event is evidence about the moment it happened, and
# a run last March should not still rank as fresh news two years on.

[[predicate]]
name = "ran"
cardinality = "many"
volatility = "fast"
aliases = ["went_for_a_run", "jogged"]
object_type = ["value"]

[[predicate]]
name = "walked"
cardinality = "many"
volatility = "fast"
aliases = ["hiked"]
object_type = ["value"]

[[predicate]]
name = "exercised"
cardinality = "many"
volatility = "fast"
aliases = ["worked_out", "trained"]
object_type = ["value"]

[[predicate]]
name = "bought"
cardinality = "many"
volatility = "fast"
aliases = ["purchased", "ordered"]
object_type = ["thing"]

[[predicate]]
name = "spent"
cardinality = "many"
volatility = "fast"
aliases = ["paid"]
object_type = ["value"]

[[predicate]]
name = "visited"
cardinality = "many"
volatility = "fast"
aliases = ["travelled_to", "traveled_to", "went_to"]
object_type = ["place"]
graph = true

[[predicate]]
name = "attended"
cardinality = "many"
volatility = "fast"
aliases = ["went_to_event"]
object_type = ["event"]
graph = true

[[predicate]]
name = "completed"
cardinality = "many"
volatility = "fast"
aliases = ["finished"]
object_type = ["value"]

[[predicate]]
name = "started"
cardinality = "many"
volatility = "fast"
aliases = ["began"]
object_type = ["value"]

[[predicate]]
name = "watched"
cardinality = "many"
volatility = "fast"
aliases = ["saw"]
object_type = ["work"]

[[predicate]]
name = "read"
cardinality = "many"
volatility = "fast"
object_type = ["work"]

[[predicate]]
name = "met"
cardinality = "many"
volatility = "fast"
aliases = ["met_with"]
object_type = ["person"]
graph = true

# ## What declares a graph edge here, and what only declares its type
#
# Three predicates carry edges: `visited`, `met` and `attended`. Each puts a thing in the
# object slot that the store is plausibly holding other facts *about* — a place, a person,
# an event — so "who else was at the conference I attended" is a walk rather than a scan.
#
# `bought`, `watched` and `read` declare an entity object and deliberately leave `graph`
# false. Their objects are real things with names, but nothing in this vocabulary makes a
# product, a film or a book the subject of anything, so a walk that crossed them would
# arrive somewhere with no onward edge and pay for the hop regardless. `docs/SUBJECT-
# CONVENTIONS.md` section 5 is the rule being applied: an entity-valued object is not
# automatically a useful edge, which is why the two are declared separately. Declare
# `graph = true` on them in your own pack if you also write facts about what you read.
#
# The rest are values. A distance, a duration and an amount are carried by the claim's own
# `amount` and `unit` fields, and the object is the reading itself.
