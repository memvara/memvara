# Engineering and operations vocabulary.
#
# The 23 builtins are a personal-assistant vocabulary — where someone lives, where they
# work, what they are doing today. A store used for infrastructure facts never matches one
# of them, so every predicate it writes falls to the unregistered default: multi-valued, so
# nothing supersedes, and SLOW, so a fact about a deploy that changed this morning still
# ranks as fresh in two years.
#
# Load with MEMVARA_PREDICATES=engineering.
#
# Cardinality is the question "can this hold several values at once for one subject?".
# Volatility is "how fast does it go stale?" — static (never), slow (years), fast (a week).

[[predicate]]
name = "deploys_to"
cardinality = "one"
volatility = "slow"
aliases = ["deployed_to", "deployment_target"]
subject_type = ["component"]
object_type = ["environment"]
graph = true

[[predicate]]
name = "current_host"
cardinality = "one"
volatility = "slow"
aliases = ["hosted_on", "runs_on"]
subject_type = ["component"]
object_type = ["host"]
graph = true

[[predicate]]
name = "git_state"
cardinality = "one"
volatility = "fast"
aliases = ["git_status", "branch_state"]
subject_type = ["component"]
object_type = ["value"]

[[predicate]]
name = "build_status"
cardinality = "one"
volatility = "fast"
aliases = ["ci_status"]
subject_type = ["component"]
object_type = ["value"]

[[predicate]]
name = "version"
cardinality = "one"
volatility = "fast"
aliases = ["current_version", "released_version"]
subject_type = ["component"]
object_type = ["value"]

[[predicate]]
name = "endpoint"
cardinality = "one"
volatility = "slow"
aliases = ["base_url", "service_url"]
subject_type = ["component"]
object_type = ["value"]

[[predicate]]
name = "owner"
cardinality = "one"
volatility = "slow"
aliases = ["owned_by", "maintainer"]
subject_type = ["component"]
object_type = ["person", "team"]
graph = true

# Multi-valued on purpose. A project rejects many things and depends on many things, and
# declaring these is not a formality: it is what stops the accumulation note firing on
# writes that are completely correct.

[[predicate]]
name = "depends_on"
cardinality = "many"
volatility = "slow"
aliases = ["requires"]
subject_type = ["component"]
object_type = ["component"]
graph = true

[[predicate]]
name = "rejected"
cardinality = "many"
volatility = "static"
aliases = ["declined"]
subject_type = ["component"]
object_type = ["value"]

[[predicate]]
name = "known_defect"
cardinality = "many"
volatility = "slow"
aliases = ["known_issue", "known_bug"]
subject_type = ["component"]
object_type = ["value"]

[[predicate]]
name = "blocked_by"
cardinality = "many"
volatility = "fast"
aliases = ["blocker"]
subject_type = ["component"]
object_type = ["component"]
graph = true

# ## Why five of these declare `graph` and six declare `value`
#
# A claim carries a graph edge only when its predicate declares both that the object is an
# entity and that walking the relation helps — `carries_edge` is `objects_are_entities and
# graph`. Until this pack said so, nothing here declared either, so every claim it wrote
# was classified `value` and this vocabulary had no graph at all. That is the rule working
# as designed: connectivity is something a vocabulary asks for, never something a string
# collision supplies. It just had nothing to ask with.
#
# The five that ask are the ones where the object is a thing you would then want to ask
# about. `memvara_cloud -depends_on-> postgres -current_host-> db.internal` is a chain
# worth walking, and it is the shape an infrastructure store is full of. `owner` joins a
# component to a person, which is how "who owns the thing that is blocking me" is answered
# in two hops rather than two queries.
#
# The six that do not are not a judgement about how clean their objects are. A version
# string, a branch name, a URL and a defect description are values: nothing else in the
# store is ever their subject, so an edge from them would go nowhere. `rejected` is the
# one that could have gone either way — sometimes a rejected thing is a component — and it
# is declared `value` because the object is more often a sentence about an approach than a
# name something else is stored under, and a false join degrades retrieval invisibly while
# a missing one costs a hop a later declaration recovers.
#
# `endpoint` is a value for the same reason as `version`, and it is the one that looks most
# like an entity: a URL is a name, and something could plausibly be filed under it. Nothing
# in either shipped vocabulary is, so an edge from it would go nowhere today.
#
# **No inverses are declared here**, and that is `bench/packs/twowiki.toml`'s rule rather
# than an oversight: nothing reads `inverse` yet, reverse traversal already works for any
# predicate with `graph = true` — `GraphTraverser._edges` emits both directions from the
# claim itself — and a wrongly declared inverse is a future correctness bug for no present
# gain. `depended_on_by` and `blocks` are not in doubt, but two shipped vocabularies
# answering the same question differently is worse than either answer.
#
# `owner` takes a team as readily as a person, so both are declared. Type enforcement is a
# later step in `docs/SUBJECT-CONVENTIONS.md` rather than something that runs today, and a
# narrower declaration made now would refuse `platform-team` when it arrives.
