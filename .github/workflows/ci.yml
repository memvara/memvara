# The suite enforces `fail_under = 100`. Until this workflow existed it enforced it on
# exactly one developer machine running one Python — which is not enforcement, it is a
# local habit. The matrix is the point: `requires-python = ">=3.10"` is a promise, and
# 3.10 through 3.12 had never executed a line of this library.
#
# The action pins below are majors, and they are the *current* majors rather than the
# oldest ones that happen to be new enough. Node 20 went out of support, and the runner had
# started forcing `actions/checkout@v4` and `actions/setup-python@v5` onto Node 24 with a
# deprecation warning on every run. That forcing is a courtesy and it will be withdrawn;
# on the day it is, every job in this file fails at its first step, with nothing in the
# repository having changed. `checkout@v5` and `setup-python@v6` were the first majors to
# declare `runs.using: node24` and would have silenced the warning, but pinning to a major
# that is already two behind only schedules this same change again. What the newer majors
# break is not reachable from here, which is the part worth checking rather than assuming:
# checkout v7 refuses fork checkouts under `pull_request_target` and `workflow_run`, and
# this repository triggers on neither; setup-python v7 removed the `pip-install` input, and
# nothing here passes it.
#
# `cache: pip` is the part of that bump to watch, because its failure mode is a *passing*
# build. setup-python v6 downgraded "the cache directory does not exist" from an error to a
# warning, and a cache that quietly stops being restored looks exactly like a green run
# that got slower — and nobody investigates a green run. If these jobs start taking minutes
# longer, read the setup-python step's log for `Cache restored from key:` before looking
# anywhere else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this workflow instead of restating the matrix, so the release gate
  # and the everyday gate cannot drift apart — there is only one list of interpreters in
  # this repository. Purely additive: a tag push matches none of the triggers above, so
  # nothing about what runs on an ordinary push or pull request changes.
  workflow_call:

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel siblings: "3.10 fails and 3.13 passes" is the single most useful
      # thing this matrix can tell us, and fail-fast throws it away.
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Two more OSes on one version each. The store touches mmap, file locking and
          # path handling — all three differ on Windows, and none of it is exercised by
          # running Linux four times.
          - python: "3.13"
            os: macos-latest
          - python: "3.13"
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # `cloud` alongside `dev`: RemoteStore's tests use `httpx.MockTransport` as
          # their offline seam (see tests/test_store_remote.py), so without the `cloud`
          # extra installed the module fails to collect at all rather than skipping.
          python -m pip install -e ".[dev,cloud]"

      - name: Test
        env:
          # Lets `test_the_deployment_serves_the_tools_this_library_declares` actually run.
          # `tools/list` needs Authorization, so without this the one guard that compares
          # this library against what is DEPLOYED skips on every run -- visibly, with its
          # reason in the log, and still never executing. A permanent skip is not a guard.
          # Unset in forks and until the secret exists, where it goes back to skipping.
          MEMVARA_API_KEY: ${{ secrets.MEMVARA_API_KEY }}
        run: python -m pytest -q

  coverage:
    # Separate job, one version. Coverage is a property of the suite, not of the
    # interpreter, so measuring it four times would just be four chances to flake.
    name: coverage (gated at 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          # See the `test` job: RemoteStore's tests need `httpx` (the `cloud` extra) to
          # collect at all, and every line in memvara/store/remote.py is covered only
          # when they run.
          python -m pip install -e ".[dev,cloud]"
      # `coverage report` exits non-zero below fail_under, so this step is the gate.
      - run: |
          python -m coverage run -m pytest -q
          python -m coverage report

  types:
    # The package ships `py.typed`, so these annotations are what a user's checker
    # consumes — and `search()` is `@overload`ed, which is the kind of declaration that
    # can be wrong in a way no runtime test notices: a bad overload type-checks a call
    # that then fails. The overload tests skip without mypy installed, so without this
    # job they were enforced only on machines that happened to have it.
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          # `memvara/store/remote.py`, `memvara/server/login.py` and
          # `memvara/server/init.py` import `httpx` under `TYPE_CHECKING`/lazily; mypy
          # still needs it installed to resolve the import, or every annotated use of it
          # is an `import-not-found` error regardless of whether the code is correct.
          python -m pip install -e ".[dev,cloud]"
      - run: python -m mypy -p memvara
      # The benchmark's adapter interface is a `Protocol`, and a Protocol nothing checks
      # is decorative — an adapter can drift out of conformance with no runtime symptom
      # until the run loop reaches it. `--ignore-missing-imports` because `benchmarks/`
      # is not an installed package and a third-party adapter's dependencies are not
      # installed here; what is being checked is this repository's own code.
      - run: python -m mypy benchmarks/agent_memory --ignore-missing-imports

  offline:
    # The headline claim is "numpy and nothing else, runs offline with no API key". That
    # is worth testing rather than asserting: install the bare package with no extras and
    # import every module, so an accidental top-level `import anthropic` in some adapter
    # cannot pass CI.
    name: core imports with no extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Import every module from a directory that is not the repo
        run: |
          cd /tmp
          python -c "
          import importlib, pkgutil, memvara
          failed = []
          for m in pkgutil.walk_packages(memvara.__path__, 'memvara.'):
              try:
                  importlib.import_module(m.name)
              except ImportError as e:
                  # Optional adapters may import their provider lazily; a hard failure
                  # here means a top-level dependency leaked into the core install.
                  failed.append((m.name, str(e)))
          assert not failed, failed
          print('all modules import with numpy alone')
          "

  benchmark:
    # A 40-question smoke run of the Agent Memory Benchmark, not the full one. The full
    # run is a second per system and would fit here easily; the reason not to put it here
    # is that a benchmark in CI stops being a benchmark and becomes a gate, and a gate
    # that reports a *score* teaches everyone to make the score go up. What this job
    # protects is that the harness still runs and still reproduces — the numbers are
    # published from a deliberate local run, and `tests/test_agent_memory_bench.py`
    # already covers the scoring rules on every commit.
    #
    # `--repeat-check` is the part worth having in CI. It runs each system twice and
    # fails if a single per-question verdict differs, which is how nondeterminism gets
    # caught on the interpreter and platform this repository actually supports rather
    # than on whichever laptop last ran it.
    #
    # The one difference it reported during development was spurious, and it is the
    # reason the check is scoped the way it is: memvara mints claim ids as `uuid4`, so
    # the `support` column differed on every run while every answer stayed identical.
    # `results.comparable` now excludes `support` and the timings, and compares the
    # accuracy figures and every per-question verdict — the things a published number
    # depends on.
    name: benchmark smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # The bare package: the benchmark's headline is that it needs no key, no network
      # and no extras, and installing `dev` here would stop this job from checking that.
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: The dataset is still the generator's output
        run: |
          python benchmarks/agent_memory/datasets/build_v1.py --out /tmp/regen
          diff -r /tmp/regen benchmarks/agent_memory/datasets/v1
      - name: Every system answers, twice, identically
        run: |
          python -m benchmarks.agent_memory --quick --repeat-check --quiet \
            --system memvara --system naive --system vector-rag

  npm-bridge:
    # `npx memvara` is JavaScript, and until 0.1.0 no JavaScript ran in this workflow at
    # all — the npm tests were Python assertions about files, spawned through the matrix
    # and skipped whenever node happened to be unloadable. That arrangement let a real
    # bug reach a release: `publish-npm` handed npm a path it read as a git repository,
    # and the only thing that would have caught it was running the thing.
    #
    # A matrix, not one version, because this package's whole dependency story is "Node's
    # standard library" — so the standard library is the dependency, and a behaviour that
    # differs across supported majors is exactly the class of defect nobody would find
    # locally. 20 is the floor `package.json` declares.
    name: npx memvara on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No `npm ci` and no cache: there is nothing to install. A step that installed
      # something would be the first thing to notice if that ever stopped being true.
      - name: The suite runs offline
        working-directory: npm/memvara
        run: node --test
