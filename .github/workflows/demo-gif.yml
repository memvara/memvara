# Attach the 90-second demo, as a GIF, to a GitHub Release that already exists.
#
# The README needs an image and this repository is a bad place to keep one. The whole
# history is 2.3 MiB packed; the GIF is 1.1 MB, so committing it would make one binary
# roughly a third of everything anybody clones — and every regeneration would add another
# copy, permanently, because git keeps what it has seen. A release asset is stored outside
# the object database, so it costs a clone nothing and a stale one can be replaced rather
# than accumulated.
#
# The stable address is
# https://github.com/memvara/memvara/releases/latest/download/demo.gif
# which GitHub resolves to the newest release that is neither a draft nor a prerelease.
# That is the URL the README embeds, and it keeps pointing at the current demo without the
# README ever changing.
#
# **This attaches to a release; it never creates one.** The first version fired on a `v*`
# tag push and ran `gh release create`, which was wrong twice over. It would have published
# a GitHub Release the moment a tag was pushed — ahead of the human approval that
# `release.yml`'s `pypi` environment exists to require, announcing a release that might
# never reach PyPI. And it passed no `--prerelease`, so tagging `v1.0.0rc1` would have
# created a full release and moved `releases/latest` onto a release candidate, which is
# the opposite of what the note below says happens.
#
# Firing on `release: published` instead means a human decided a release exists and this
# job only decorates it. Nothing here can announce anything.
#
# Two things that look like this job having failed, and are not:
#
# 1. **A prerelease does not move `latest`.** Publish `v1.0.0rc1`, this job attaches the
#    GIF to it, and the README still shows the last full release's. Correct, and it looks
#    like nothing ran.
# 2. **GitHub proxies README images through camo, which caches them.** A regenerated asset
#    at the same URL can take a while to appear on the rendered page. Check the release's
#    own asset, not the README, when you want to know what was published.

name: Demo GIF

on:
  release:
    types: [published]
  workflow_dispatch:
    # For attaching the GIF to a release that already shipped, and for republishing after
    # `demo.py` changes without waiting for the next release.
    inputs:
      tag:
        description: "Tag of an existing release to attach demo.gif to (e.g. v0.9.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: record the demo and attach it to the release
    runs-on: ubuntu-latest
    # Raised here and nowhere else, matching how `release.yml` scopes `id-token: write` to
    # the one job that uploads. This is the only job in the repository that can write to
    # the repository's own contents.
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a release, the released source: the recorder runs `demo.py` out of the
          # working tree, so the GIF should show what that release actually shipped.
          #
          # On a dispatch, the ref the run was started from, **not** the tag. The tag
          # names the release to attach to, which is a different question from what to
          # record — and the two come apart in exactly the case dispatch exists for. The
          # first version checked out the tag both ways and could not have backfilled
          # `v0.9.0` at all: `examples/` did not exist at that tag, so there was no
          # `record_gif.py` to run. Recording an old release's asset from today's source
          # is the honest trade, and the reason the GIF is a build product rather than
          # something the release carries a copy of.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: There is a release to attach to
        # Before spending three minutes on a recording. A dispatch with a typo, or with a
        # tag whose release was never published, otherwise fails at the last step with the
        # work already done.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::no published release for tag '$TAG'. This job attaches an asset to a release; it does not create one. Publish the release first, or pass a tag that has one."
            exit 1
          fi

      - name: Install memvara and Pillow
        # Pillow is the recorder's only dependency beyond the standard library, and it is
        # deliberately not a dependency of the library itself.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . Pillow

      - name: Record it
        # No `--live`. The default replays the schedule `demo.py` declares, on a virtual
        # clock, so the same source always produces the same bytes — which is the only
        # reason a job like this can tell a regenerated GIF from an unchanged one. A
        # measured recording differs by milliseconds a frame and so differs in bytes every
        # run, and would also take ninety seconds of runner time to say the same thing.
        # The runner's DejaVu Sans Mono is the first entry in FONT_CANDIDATES.
        run: python3 examples/temporal_memory_demo/record_gif.py demo.gif

      - name: Look at the frames, since nothing upstream can
        # `record_gif.py` says in its own output that it cannot tell a correct frame from a
        # blank one. Neither can this, exactly — but the three failures that would actually
        # happen here are all visible in the file: a font that resolved but drew nothing
        # (every frame one colour), a demo that died part-way (frames collapse), and a
        # pacing bug that turned ninety seconds into a flicker (delays collapse).
        run: |
          python3 - <<'PY'
          import sys
          from PIL import Image

          gif = Image.open("demo.gif")
          delays = []
          inked = 0
          for index in range(gif.n_frames):
              gif.seek(index)
              delays.append(gif.info["duration"])
              if len(gif.convert("RGB").getcolors(maxcolors=1 << 16)) > 1:
                  inked += 1
          seconds = sum(delays) / 1000

          print(f"{gif.n_frames} frames, {inked} with ink, {seconds:.1f}s, "
                f"{gif.size[0]}x{gif.size[1]}")

          problems = []
          if gif.n_frames < 40:
              problems.append(f"only {gif.n_frames} frames; the demo prints at ~56 "
                              "instants, so this one stopped part-way")
          if inked < gif.n_frames - 1:
              problems.append(f"{gif.n_frames - inked} frames are a single colour. A "
                              "font that loaded but drew nothing renders as an empty "
                              "frame rather than as an error")
          if not 85 <= seconds <= 105:
              problems.append(f"the frame delays add up to {seconds:.1f}s, and demo.py's "
                              "BEATS end at 90s with a 4s tail hold. The pacing did not "
                              "survive")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # `--clobber` because republishing is the normal case: the asset is a build product
        # of `demo.py`, and replacing it is the whole reason it is not committed.
        run: |
          set -euo pipefail
          gh release upload "$TAG" demo.gif --clobber
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'
